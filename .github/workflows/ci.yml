# Runs on every push to main and on pull requests. Vercel's Deployment Checks
# wait for these jobs: if one fails, the new version is not published.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (lint, types, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  database:
    name: Database (migrations + RLS tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Only the database: applies every migration from scratch, which also
      # checks that they still run in order on an empty project.
      - run: supabase db start
      - run: supabase test db

  # Vercel's Deployment Checks read commit statuses, not job results: this
  # job sums up the two above into a single "Travio CI" status on the commit.
  # That is the check required in Vercel → Settings → Deployment Checks.
  vercel-status:
    name: Vercel status
    needs: [app, database]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ needs.app.result == 'success' && needs.database.result == 'success' && 'success' || 'failure' }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$STATE" \
            -f context="Travio CI" \
            -f description="App: ${{ needs.app.result }} · Database: ${{ needs.database.result }}" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
